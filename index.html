<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYA Polycarbonate & Steel | Premium Construction Materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0B0F19; /* Deep Obsidian Black */
            --secondary: #1E2640; /* Deep Luxury Slate */
            --accent: #D4AF37; /* Metallic Gold */
            --accent-hover: #F3E5AB; /* Soft Silk Gold */
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--primary);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Header & Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            transition: var(--transition);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .nav-cta {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.6rem 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .nav-cta:hover {
            background: var(--accent);
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, rgba(11,15,25,1) 30%, rgba(30,38,64,0.8) 100%);
            padding: 0 2rem;
            overflow: hidden;
        }

        /* Subtle Geometric Background Asset */
        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            border: 1px solid rgba(212, 175, 55, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            z-index: 2;
            padding-top: 60px;
        }

        .hero-badge {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 1.5rem;
            display: inline-block;
            font-weight: 600;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2.5rem auto;
            font-weight: 300;
        }

        /* Google Business Card Embedded style inside Hero or standalone */
        .business-snippet {
            background: rgba(30, 38, 64, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(8px);
            padding: 1.5rem;
            border-radius: 4px;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            text-align: left;
            margin-top: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .snippet-info h3 {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .snippet-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rating {
            color: #FFD700;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .status-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #F87171;
            padding: 0.2rem 0.6rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .snippet-actions {
            display: flex;
            gap: 1rem;
        }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(212, 175, 55, 0.05);
            transform: translateY(-2px);
        }

        /* --- Global Section Settings --- */
        section {
            padding: 8rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-header span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            font-weight: 600;
        }

        .section-header h2 {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            margin-top: 0.5rem;
        }

        /* --- About Section --- */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-family: var(--font-serif);
            font-size: 2rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
            color: var(--accent);
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
            font-weight: 300;
        }

        .about-features {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .feature-item i {
            color: var(--accent);
            margin-top: 0.3rem;
        }

        .feature-item div h4 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

            font
